[package]
name = "egui_widgets_example"
version = "0.1.0"
edition = "2024"
description = "Native and WebAssembly demo of egui_widgets"
publish = false

[[bin]]
name = "egui-widgets-example"
path = "src/main.rs"

[dependencies]
egui_widgets = { path = ".." }
eframe = "0.37"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-futures = "0.4"
log = "0.4"
web-sys = "0.3"
