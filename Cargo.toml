[package]
name = "egui_widgets"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "Reusable egui widgets"
repository = "https://github.com/vojtech-homola/egui-widgets"
license = "MIT"
readme = "README.md"
keywords = ["egui", "gui", "widget", "spinbox", "numeric"]
categories = ["gui"]
include = ["/src", "/tests", "/LICENSE", "/README.md"]

[dependencies]
egui = { version = "0.36", default-features = false }

[dev-dependencies]
# Tests measure and select text, which needs real glyphs.
egui = { version = "0.36", default-features = false, features = ["default_fonts"] }
egui_kittest = "0.36"
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "graph"
harness = false

[workspace]
members = [".", "example"]
